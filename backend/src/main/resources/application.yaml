spring:
  application:
    name: inventario-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/inventario_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: ${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:c3VwZXJTZWNyZXRLZXlXaXRoQXRMZWFzdDMyQnl0ZXNMZW5ndGhJbnZlbnRhcmlvMjAyNiE=}
  expiration: ${JWT_EXPIRATION:86400000} # 24 horas en milisegundos (ms)

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
