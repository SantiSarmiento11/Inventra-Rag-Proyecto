# ==============================================================================
# CONFIGURACIÓN GENERAL DEL FRAMEWORK (SPRING BOOT / HIBERNATE / OPENAPI)
# NOTA: Todos los datos seguros, credenciales, puertos y secretos residen en el
# archivo .env de la raíz del proyecto. No almacenar credenciales aquí.
# ==============================================================================

spring:
  application:
    name: inventario-backend

  # Conexión a Base de Datos parametrizada desde .env
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  # Configuración JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}
    properties:
      hibernate:
        format_sql: true
        dialect: ${JPA_DIALECT}

# Servidor HTTP
server:
  port: ${SERVER_PORT}

# Parámetros de Seguridad JWT (definidos en .env)
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

# CORS (Orígenes autorizados definidos en .env)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Configuración de Documentación OpenAPI / Swagger UI (Estructural)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true
